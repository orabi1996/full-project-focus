name: Apply workflow persistence patch

permissions:
  contents: write

on:
  push:
    branches: [chatgpt-dev]
    paths:
      - scripts/apply-workflow-persistence.mjs

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: node scripts/apply-workflow-persistence.mjs
      - name: Commit generated source change and remove one-shot patch files
        run: |
          rm -f scripts/apply-workflow-persistence.mjs .github/workflows/apply-workflow-persistence.yml
          git config user.name "Focus HRMS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/context/AppContext.tsx scripts/apply-workflow-persistence.mjs .github/workflows/apply-workflow-persistence.yml
          git diff --cached --exit-code && exit 0
          git commit -m "feat(workflow): persist approval chains and delegations"
          git push origin HEAD:chatgpt-dev
